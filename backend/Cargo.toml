[package]
name = "spielberg-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
base64 = "0.22"
flate2 = "1.1"
tar = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
http-body-util = "0.1"
dirs = "6"
mime_guess = "2"
